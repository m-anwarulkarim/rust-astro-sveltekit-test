[package]
name = "shoes-backend"
version = "0.1.0"
edition = "2021"
authors = ["Luxury Shoes Team"]

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
argon2 = "0.5"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
futures-util = "0.3"
