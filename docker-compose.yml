version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shoe_store_db
    environment:
      POSTGRES_DB: shoes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shoes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
