version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurelia_rust_backend
    ports:
      - "8085:8080"
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_v9V5PkbpcFqj@ep-noisy-union-b4r1p79n-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=super_secret_luxury_shoe_brand_jwt_key_2026_aurelia
      - PORT=8080
      - RUST_LOG=info
      - ALLOWED_ORIGINS=*
    restart: unless-stopped

  # Optional local Postgres (in case you want offline development without Neon)
  postgres:
    image: postgres:16-alpine
    container_name: shoe_store_db
    environment:
      POSTGRES_DB: shoes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shoes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
